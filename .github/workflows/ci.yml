name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.0"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
      - run: uv run mypy
      # Whitespace, YAML/TOML checks etc. mypy ran above; secrets are scanned in their own step.
      - run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: mypy,gitleaks
      - name: Scan for secrets (gitleaks)
        run: >
          docker run --rm -v "${{ github.workspace }}:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.0 dir /repo --redact --no-banner

  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sahayak
          POSTGRES_PASSWORD: sahayak
          POSTGRES_DB: sahayak_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sahayak -d sahayak_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Integration tests fail instead of skipping when a service is unreachable.
      SAHAYAK_REQUIRE_SERVICES: "1"
      TEST_DATABASE_URL: postgresql+asyncpg://sahayak:sahayak@localhost:5432/sahayak_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term
      - name: Rule engine coverage (at least 95%, M2 exit criterion)
        run: uv run coverage report --include="*/sahayak/eligibility/*" --fail-under=95

  compose:
    name: Docker image and compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start api (with migrate, postgres, redis)
        run: docker compose up --build --detach api
      - name: Wait for /readyz
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8000/readyz; then echo; exit 0; fi
            sleep 2
          done
          echo "api did not become ready" >&2
          exit 1
      - name: Probe endpoints
        run: |
          curl -fsS http://localhost:8000/healthz
          curl -fsS -o /dev/null http://localhost:8000/docs
          test "$(docker compose ps --all --format '{{.Service}} {{.ExitCode}}' | grep '^migrate ')" = "migrate 0"
          test "$(docker compose exec -T api id -u)" = "10001"
      - name: Show logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down --volumes
