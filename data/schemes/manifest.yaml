# Curated scheme catalogue (TRD §8). Schema: src/sahayak/ingestion/manifest.py.
#
# Sources are official government pages and documents only: ministry/department sites, PIB
# (static.pib.gov.in) and NIC district portals. myScheme.gov.in is not crawled: its Terms of Use
# forbid automated access without written permission (see D-011). The first source is the
# scheme's primary source. `benefits` is a one-line summary for the catalogue; eligibility comes
# only from reviewed rules.
#
# Hindi/Marathi names and benefit summaries need a human check (M1-T14 review).
version: 1
schemes:
  - id: pm-kisan
    names:
      en: Pradhan Mantri Kisan Samman Nidhi (PM-KISAN)
      hi: प्रधानमंत्री किसान सम्मान निधि
      mr: प्रधानमंत्री किसान सन्मान निधी
    aliases: [PM-KISAN, PM Kisan, Kisan Samman Nidhi, पीएम किसान]
    ministry: Ministry of Agriculture and Farmers Welfare
    level: central
    benefits: Income support of Rs 6,000 a year to landholding farmer families, paid in three instalments.
    application_url: https://pmkisan.gov.in/
    sources:
      - url: https://pmkisan.gov.in/Documents/RevisedPM-KISANOperationalGuidelines(English).pdf
        note: Operational guidelines (revised 29.03.2020), includes the exclusion criteria.

  - id: pm-sym
    names:
      en: Pradhan Mantri Shram Yogi Maan-dhan (PM-SYM)
      hi: प्रधानमंत्री श्रम योगी मान-धन
      mr: प्रधानमंत्री श्रम योगी मानधन योजना
    aliases: [PM-SYM, PMSYM, Shram Yogi Maandhan, श्रम योगी मानधन]
    ministry: Ministry of Labour and Employment
    level: central
    benefits: Assured pension of Rs 3,000 a month after age 60 for unorganised workers, with a matching government contribution.
    application_url: https://maandhan.in/
    sources:
      - url: https://static.pib.gov.in/WriteReadData/specificdocs/documents/2025/mar/doc202534512301.pdf
        note: PIB backgrounder, March 2025.
      - url: https://maandhan.in/

  - id: ab-pmjay
    names:
      en: Ayushman Bharat Pradhan Mantri Jan Arogya Yojana (AB PM-JAY)
      hi: आयुष्मान भारत प्रधानमंत्री जन आरोग्य योजना
      mr: आयुष्मान भारत प्रधानमंत्री जन आरोग्य योजना
    aliases: [PM-JAY, PMJAY, Ayushman Bharat, Ayushman Card, आयुष्मान भारत]
    ministry: Ministry of Health and Family Welfare (National Health Authority)
    level: central
    benefits: Cashless hospital cover of up to Rs 5 lakh per family per year at empanelled hospitals.
    sources:
      - url: https://static.pib.gov.in/WriteReadData/specificdocs/documents/2024/sep/doc2024923400001.pdf
        note: PIB, "Six Years of Ayushman Bharat PM-JAY", September 2024.
      - url: https://static.pib.gov.in/WriteReadData/specificdocs/documents/2024/sep/doc2024912393201.pdf
        note: PIB, "Ayushman Bharat Becomes Bigger" (cover for all citizens aged 70+), September 2024.

  - id: pmay-g
    names:
      en: Pradhan Mantri Awaas Yojana - Gramin (PMAY-G)
      hi: प्रधानमंत्री आवास योजना - ग्रामीण
      mr: प्रधानमंत्री आवास योजना - ग्रामीण
    aliases: [PMAY-G, PMAY Gramin, Awas Yojana Gramin, प्रधानमंत्री आवास योजना ग्रामीण]
    ministry: Ministry of Rural Development
    level: central
    benefits: Financial assistance to build a pucca house for houseless and kutcha-house rural families.
    application_url: https://pmayg.dord.gov.in/
    sources:
      - url: https://static.pib.gov.in/WriteReadData/specificdocs/documents/2024/nov/doc20241119437801.pdf
        note: PIB, "Pradhan Mantri Awas Yojana - Rural", November 2024.

  - id: pmuy
    names:
      en: Pradhan Mantri Ujjwala Yojana (PMUY)
      hi: प्रधानमंत्री उज्ज्वला योजना
      mr: प्रधानमंत्री उज्ज्वला योजना
    aliases: [PMUY, Ujjwala, Ujjwala 2.0, उज्ज्वला योजना]
    ministry: Ministry of Petroleum and Natural Gas
    level: central
    benefits: Deposit-free LPG connection for adult women from poor households.
    application_url: https://www.pmuy.gov.in/
    sources:
      - url: https://www.pmuy.gov.in/ujjwala2.html
        note: Ujjwala 2.0 eligibility criteria and documents.
      - url: https://www.pmuy.gov.in/about.html

  - id: ssy
    names:
      en: Sukanya Samriddhi Yojana (SSY)
      hi: सुकन्या समृद्धि योजना
      mr: सुकन्या समृद्धी योजना
    aliases: [SSY, Sukanya Samriddhi Account, SSA, सुकन्या समृद्धि]
    ministry: Ministry of Finance (Department of Economic Affairs)
    level: central
    benefits: Small-savings account for a girl child (opened before age 10) with tax-free interest.
    sources:
      - url: https://www.nsiindia.gov.in/InternalPage.aspx?Id_Pk=89
        note: National Savings Institute scheme page.
      - url: https://static.pib.gov.in/WriteReadData/specificdocs/documents/2026/jan/doc2026121762801.pdf
        note: PIB, "From Savings to Strength", January 2026.

  - id: apy
    names:
      en: Atal Pension Yojana (APY)
      hi: अटल पेंशन योजना
      mr: अटल पेन्शन योजना
    aliases: [APY, Atal Pension, अटल पेंशन]
    ministry: Ministry of Finance (PFRDA)
    level: central
    benefits: Guaranteed pension of Rs 1,000 to Rs 5,000 a month from age 60, depending on contributions.
    sources:
      - url: https://static.pib.gov.in/WriteReadData/specificdocs/documents/2025/may/doc202558551701.pdf
        note: PIB, "Atal Pension Yojana - Securing Retirement for India's Unorganised Sector", May 2025.

  - id: pm-vishwakarma
    names:
      en: PM Vishwakarma
      hi: पीएम विश्वकर्मा
      mr: पीएम विश्वकर्मा योजना
    aliases: [PM Vishwakarma Yojana, Vishwakarma Yojana, विश्वकर्मा योजना]
    ministry: Ministry of Micro, Small and Medium Enterprises
    level: central
    benefits: Recognition, skill training, toolkit incentive and collateral-free credit for artisans in 18 traditional trades.
    application_url: https://pmvishwakarma.gov.in/
    sources:
      - url: https://static.pib.gov.in/WriteReadData/specificdocs/documents/2025/sep/doc2025916638501.pdf
        note: PIB, "PM Vishwakarma Scheme - Honouring Heritage, Powering Progress", September 2025.

  - id: mh-mjpjay
    names:
      en: Mahatma Jyotirao Phule Jan Arogya Yojana (MJPJAY)
      hi: महात्मा ज्योतिराव फुले जन आरोग्य योजना
      mr: महात्मा ज्योतिराव फुले जन आरोग्य योजना
    aliases: [MJPJAY, Jan Arogya Yojana, Jeevandayee, Rajiv Gandhi Jeevandayee Arogya Yojana, जन आरोग्य योजना]
    ministry: Public Health Department, Government of Maharashtra
    level: state
    state: MH
    benefits: Cashless treatment at empanelled hospitals for families in Maharashtra, integrated with AB PM-JAY.
    application_url: https://www.jeevandayee.gov.in/
    sources:
      # jeevandayee.gov.in was unreachable when the manifest was written; NIC district portals
      # carry the official scheme description.
      - url: https://zpyavatmal.gov.in/en/scheme/ayushman-bharat-pradhan-mantri-jan-arogya-yojana-mahatma-jyotirao-phule-jan-arogya-yojana/
        note: Zilla Parishad Yavatmal scheme page (history and the integrated scheme from 1 July 2024).
      - url: https://www.zpsatara.gov.in/en/scheme/combined-mahatma-jyotirao-phule-jan-arogya-yojana-and-pradhan-mantri-jan-arogya-yojana/
        note: Zilla Parishad Satara scheme page (ration card categories).

  - id: mh-majhi-ladki-bahin
    names:
      en: Mukhyamantri Majhi Ladki Bahin Yojana
      hi: मुख्यमंत्री माझी लाडकी बहन योजना
      mr: मुख्यमंत्री माझी लाडकी बहीण योजना
    aliases: [Ladki Bahin, Majhi Ladki Bahin, MMLBY, लाडकी बहीण]
    ministry: Women and Child Development Department, Government of Maharashtra
    level: state
    state: MH
    benefits: Rs 1,500 a month by direct benefit transfer to eligible women aged 21 to 65 in Maharashtra.
    application_url: https://ladakibahin.maharashtra.gov.in/
    sources:
      # The GR of 28 June 2024 (gr.maharashtra.gov.in) is the authoritative text, but its PDF uses
      # the "Sakal Marathi" font, whose text layer extracts as garbled Devanagari (see D-012).
      - url: https://pune.gov.in/scheme/mukhyamantri-majhi-ladki-bahin-yojana/
        note: Pune district administration scheme page (eligibility list from the GR).
