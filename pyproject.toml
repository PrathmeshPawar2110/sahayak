[project]
name = "sahayak"
version = "0.1.0"
description = "Multilingual voice agent that helps Indian citizens find government schemes, check eligibility and prepare applications."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.13.0",
    "asyncpg>=0.32.0",
    "certifi>=2026.7.22",
    "fastapi>=0.143.0",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=2",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "pgvector>=0.5.1",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
    "trafilatura>=2.3.1",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "fakeredis>=2.39.0",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
    "rust-just>=1.58.0",
    "types-pyyaml>=6.0.12.20260906",
]
# Populated in M5 (STT/TTS providers, audio transcoding helpers).
voice = []
# Populated in M10 (encryption, file-type checks, image cleanup, blob storage).
vault = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sahayak"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
# Don't reformat code samples inside docs (e.g. the TRD).
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "S",        # bandit
    "SIM",      # simplify
    "ASYNC",    # async pitfalls (blocking calls in async code)
    "PT",       # pytest style
    "TID",      # tidy imports
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"src/sahayak/db/alembic/versions/*" = ["N999"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
# Migration modules are named like 20261010_0001_baseline.py (not importable names).
exclude = ["src/sahayak/db/alembic/versions/"]
warn_unreachable = true
# pymupdf ships partial annotations; its unannotated functions are still safe to call.
untyped_calls_exclude = ["pymupdf"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not live"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs real Postgres/Redis (auto-applied to tests/integration)",
    "e2e: end-to-end tests (auto-applied to tests/e2e)",
    "live: calls paid external APIs; excluded by default, run with `pytest -m live`",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["sahayak"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
